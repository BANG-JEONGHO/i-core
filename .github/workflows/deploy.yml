name: Deploy i-Core to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend
        run: |
          gcloud run deploy i-core-backend \
            --source ./backend \
            --region asia-northeast3 \
            --allow-unauthenticated \
            --add-cloudsql-instances "iceu-bangjeongho833:asia-northeast3:icore-postgres" \
            --set-env-vars "APP_NAME=i-Core API,DEBUG=false,GOOGLE_CLIENT_ID=761086712825-cp5lvscdoer4lt8emg2gmhbrejktng0s.apps.googleusercontent.com" \
            --set-secrets "SECRET_KEY=icore-secret-key:latest,GEMINI_API_KEY=gemini-api-key:latest,DATABASE_URL=icore-app-database-url:latest,INSTRUCTOR_DATABASE_URL=icore-instructor-database-url:latest"

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Frontend
        run: |
          gcloud run deploy i-core-frontend \
            --source ./frontend \
            --region asia-northeast3 \
            --allow-unauthenticated
