[project]
name = "i-core"
version = "0.1.0"
description = ""
authors = [
    {name = "bangjeongho",email = "bangjeongho833@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.30.6",
    "sqlalchemy>=2.0.51",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.1",
    "google-genai>=2.6.0",
    "google-auth>=2.48.1",
    "pdfplumber>=0.10.4",
    "python-docx>=1.1.2",
    "olefile>=0.47",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "google-cloud-storage>=2.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.28.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "mypy>=1.11.0",
]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false


[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]


